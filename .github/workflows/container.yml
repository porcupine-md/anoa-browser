name: Container

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.github/workflows/container.yml'
      - 'tests/e2e/container_e2e.sh'
  workflow_dispatch:
    inputs:
      version:
        description: 'anoa release to build the image from (e.g. v0.6.0, or "latest")'
        required: false
        default: 'latest'
  # Every release gets an image tagged with the same version — the trigger that
  # matters, since a release without an image is the case people actually hit.
  #
  # It hangs off the Release workflow finishing, NOT off `release: published`,
  # and that is not a style choice. Our releases are created by the Release
  # workflow using GITHUB_TOKEN, and GitHub deliberately does not raise events
  # for actions taken with that token — an anti-recursion rule. A `release`
  # trigger here would therefore never fire even once; it did not, across every
  # release this repository has cut.
  workflow_run:
    workflows: [Release]
    types: [completed]

  # Kept for a release published by hand, where the token rule does not apply.
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build, test, and publish
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # A chained run must not publish anything when the release it is chained to
    # failed; every other trigger has nothing to check.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      # Which anoa release goes in the image. A release event pins to that
      # release; a manual run takes the input; a branch push takes the latest.
      # Never left implicit — an image whose contents depend on when it was
      # built is an image nobody can reproduce.
      - name: Resolve the anoa version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            release) v="${{ github.event.release.tag_name }}" ;;
            workflow_dispatch) v="${{ inputs.version }}" ;;
            # Chained off Release: the release it just published is the latest,
            # so resolving `latest` below names exactly the right version.
            workflow_run) v="latest" ;;
            *) v="latest" ;;
          esac
          if [ "$v" = "latest" ]; then
            # Not `curl | grep -m1`: grep exits on the first match, curl dies
            # writing the rest of the body, and pipefail made that exit 23 —
            # every chained run since v0.7.0 failed here, before building
            # anything. gh is on the runner and uses GITHUB_TOKEN, so this is
            # also not subject to the unauthenticated rate limit.
            v="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          fi
          [ -n "$v" ] || { echo "::error::could not resolve an anoa version"; exit 1; }
          echo "anoa=$v" >> "$GITHUB_OUTPUT"
          echo "resolved to $v"

      - uses: docker/setup-buildx-action@v3

      # Built and loaded locally first, then tested, then pushed. Pushing an
      # untested image and testing it afterwards means a broken image was
      # public for the length of the test.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: anoa:test
          build-args: |
            ANOA_VERSION=${{ steps.version.outputs.anoa }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the image
        run: |
          chmod +x tests/e2e/container_e2e.sh
          CONTAINER_ENGINE=docker tests/e2e/container_e2e.sh anoa:test

      # Everything below only runs once the image has proved itself, and only
      # where a push makes sense — a pull request from a fork has no
      # credentials and should not be publishing anything.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.anoa }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_run' }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=anoa
            org.opencontainers.image.description=Headless browser with CDP and an agent CLI
            org.opencontainers.image.version=${{ steps.version.outputs.anoa }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ANOA_VERSION=${{ steps.version.outputs.anoa }}
          cache-from: type=gha

      - name: Summary
        if: always()
        run: |
          {
            echo "### Container image"
            echo
            echo "- anoa version: \`${{ steps.version.outputs.anoa }}\`"
            echo "- tags: \`${{ steps.meta.outputs.tags || 'not pushed' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
