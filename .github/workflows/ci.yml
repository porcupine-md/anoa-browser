name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

env:
  QT_VERSION: "6.7.3"
  QPA_PLATFORM: offscreen
  QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --no-sandbox"

jobs:
  # ── 1. Unit Tests (QTest, no binary needed) ────────────────────────────────
  # Runs on both Linux and macOS: the QTest suite carries the check that QImage
  # decodes PNG under a plain QCoreApplication (no GUI application object),
  # which terminal mode depends on and which is platform-specific.
  unit-tests:
    name: Unit Tests (QTest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: macos-14
            qt_host: mac
            qt_arch: clang_64

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-${{ matrix.os }}

      # Only Linux needs this; the top-level find_package pulls in WebEngine,
      # which wants CUPS headers there.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libcups2-dev

      - name: Configure (BUILD_TESTS=ON)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR

      # Three targets, three libraries, no WebEngine in any of them:
      # anoa-config-lib (config.cpp against Qt6::Core), anoa-terminal-bytes-lib
      # (the wire-facing PPM/PNG parsers) and anoa-terminal-ui-lib (the input
      # parser, cell map and image-protocol renderers).
      - name: Build test targets
        run: |
          cmake --build build --parallel \
            --target anoa-test-config \
                     anoa-test-frame-bytes \
                     anoa-test-terminal-ui \
                     anoa-test-tab-ids

      - name: Run unit tests (CTest)
        run: ctest --test-dir build -V --output-on-failure

      # Linux only, and only the two terminal targets. frame_bytes.cpp sizes a
      # copy from numbers a peer chose off the wire — an out-of-bounds read and
      # an unsigned wrap are exactly what these sanitizers exist for, and the
      # bug they were added for (bug-001) was a guard that wrapped to SIZE_MAX.
      # Cheap because neither target links WebEngine: it is a rebuild of two
      # small libraries, not of the browser.
      - name: Run unit tests under ASan + UBSan
        if: runner.os == 'Linux'
        run: |
          cmake -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DANOA_TEST_SANITIZE=ON \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build-asan --parallel \
            --target anoa-test-frame-bytes anoa-test-terminal-ui
          ./build-asan/tests/unit/anoa-test-frame-bytes
          ./build-asan/tests/unit/anoa-test-terminal-ui
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

      # Linux only, and a third build of the same three libraries — gcov and
      # ASan want different instrumentation, so tests/unit/CMakeLists.txt
      # refuses to enable both at once.
      #
      # The gate covers what the unit targets link and nothing else. The
      # browser/http/cdp sources are driven only by the integration and e2e
      # suites, which talk to a separate anoa process; that process is
      # not instrumented, so folding those files in here would report 0% for
      # code those suites cover well. See the header of tests/coverage.sh.
      - name: Check unit-test line coverage
        if: runner.os == 'Linux'
        run: QT_PREFIX=$QT_ROOT_DIR COVERAGE_MIN=80 bash tests/coverage.sh

      - name: Upload coverage listings
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gcov
          path: build-coverage/.coverage-report/*.gcov
          if-no-files-found: warn
          retention-days: 7

  # ── 2. Integration Tests (Node.js + running binary) ───────────────────────
  # Re-enabled. The case that switched this gate off — THTTP-08, the viewer
  # against an endpoint that accepts and then goes quiet — was an `it.fails`
  # written to go red the day the transport grew a timeout. bug-003 landed that
  # timeout, the annotation went with it, and the case is ordinary now.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install integration test dependencies
        working-directory: tests/integration
        run: npm install

      # Do NOT start a shared anoa here: every integration test file
      # spawns (and stops) its own instance on the same port triplet. A shared
      # instance on 9222 makes those spawns fail to bind, so auth suites end up
      # talking to the shared no-auth browser and fail with 200-instead-of-401.
      - name: Run integration tests (Vitest)
        working-directory: tests/integration
        run: npx vitest run

  # ── 3. Shell Integration Tests ─────────────────────────────────────────────
  # Re-enabled. TERM-MODE-02a asserted QCommandLineParser's own "[options]"
  # usage line, which stopped existing when --help became the grouped help; it
  # now asserts the help we actually print.
  shell-tests:
    name: Shell Integration Tests
    runs-on: ubuntu-22.04
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - name: Run port layout tests
        run: bash tests/integration/port_layout.test.sh
        env:
          ANOA_BINARY: ./build/anoa

      - name: Run extension loading tests
        run: bash tests/integration/extensions.test.sh
        env:
          ANOA_BINARY: ./build/anoa

      # Reads the tree, not the binary: terminal mode is compiled out on
      # Windows and there is no Windows job, so the only available check that
      # it stays compiled out is a negative one.
      - name: Run build shape tests
        run: bash tests/integration/build_shape.test.sh

  # ── 3b. Qt API Floor ───────────────────────────────────────────────────────
  # CMakeLists.txt says the floor is Qt 6.4; every other job pins 6.7.3, so
  # without this nothing between the two numbers is ever exercised and a
  # \since 6.5 API reaches a distro user before it reaches CI. Syntax-only
  # against QtCore/Gui/Network/WebSockets — no WebEngine, no link step, which
  # is what makes a second Qt version affordable to install.
  qt-floor:
    name: Qt 6.4 API Floor
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          # Qt renamed the Linux desktop architecture between 6.4 and 6.7:
          # 6.4.3 publishes `gcc_64`, 6.7.3 publishes `linux_gcc_64`. Asking for
          # the new name at the old version made aqt report "The packages
          # ['qt_base', 'qtwebsockets'] were not found", which reads as "Qt
          # archived 6.4.3" — it has not; the tree is still published, under the
          # other name. This job was red for that reason alone, and a floor
          # check that cannot install its floor is not checking anything.
          version: "6.4.3"
          host: linux
          target: desktop
          arch: gcc_64          # not linux_gcc_64 — see the note above
          modules: qtwebsockets
          install-deps: true
          cache: true
          cache-key-prefix: qt-6.4.3-floor

      # QT_FLOOR_PREFIX is unset here on purpose: the script falls back to
      # QT_ROOT_DIR, which install-qt-action exports into the job environment.
      - name: Syntax-check src/terminal against the declared floor
        run: bash tests/integration/qt_floor.test.sh

  # ── 4. E2E Tests (Playwright + Puppeteer) ─────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright / Puppeteer)
    runs-on: ubuntu-22.04
    # Deliberately on unit-tests, not integration-tests. It was moved here when
    # integration was disabled — a skipped dependency skips its dependents, so
    # E2E and the smoke suite behind it were being skipped too — and it stays
    # here now that integration is back: the two suites share nothing but a
    # built binary, so chaining them only means E2E waits, and a red integration
    # run hides whether E2E passed. Parallel gives both answers every push.
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm install

      - name: Install Playwright browser
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Start anoa
        run: |
          ./build/anoa --headless --port 9222 &
          echo "BROWSER_PID=$!" >> $GITHUB_ENV
          timeout 30 bash -c 'until nc -z 127.0.0.1 9222; do sleep 0.5; done'

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Run Puppeteer tests
        working-directory: tests/e2e
        run: node --test puppeteer.test.js

      - name: Stop anoa
        if: always()
        run: kill ${{ env.BROWSER_PID }} || true

  # ── 5. Regression Smoke Tests ─────────────────────────────────────────────
  smoke-tests:
    name: Regression Smoke Tests
    runs-on: ubuntu-22.04
    needs: e2e-tests
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebchannel qtwebsockets qtpositioning qtwebengine
          install-deps: true
          cache: true
          cache-key-prefix: qt-${{ env.QT_VERSION }}-linux-gcc64

      - name: Install system dependencies
        run: sudo apt-get install -y libcups2-dev

      - name: Build binary
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$QT_ROOT_DIR
          cmake --build build --parallel

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # smoke.sh runs its node snippets from these directories — a global
      # npm install is not on Node's ESM resolution path.
      - name: Install smoke test dependencies
        run: |
          (cd tests/integration && npm install)
          (cd tests/e2e && npm install)

      - name: Run smoke tests
        run: bash tests/regression/smoke.sh
        env:
          ANOA_BINARY: ./build/anoa