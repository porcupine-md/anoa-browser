name: Update Homebrew tap

# Standalone trigger to (re)sync the Homebrew tap with an existing GitHub
# Release — for when the tap update inside the Release workflow was skipped
# (HOMEBREW_TAP_TOKEN missing), failed, or the release was created manually.
# Run it from Actions → "Update Homebrew tap" → Run workflow; leave `tag`
# empty to sync the latest release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.3.1). Empty = latest release.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Syncing tap to release $TAG"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern 'anoa-macos-universal.tar.gz' \
            --pattern 'anoa-linux-x86_64.tar.gz' \
            --pattern 'anoa-linux-aarch64.tar.gz'
          # The aarch64 tarball is hashed below, so it must be downloaded too —
          # without the pattern above sha256sum fails under set -e and this
          # workflow has been unable to run since aarch64 shipped (issue #37).

      - name: Update tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN not set — cannot push to the tap."
            exit 1
          fi
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          MACOS_SHA256=$(sha256sum anoa-macos-universal.tar.gz | awk '{print $1}')
          LINUX_X86_64_SHA256=$(sha256sum anoa-linux-x86_64.tar.gz | awk '{print $1}')
          LINUX_AARCH64_SHA256=$(sha256sum anoa-linux-aarch64.tar.gz | awk '{print $1}')
          git clone --depth=1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/porcupine-md/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p Casks Formula

          # macOS Cask
          sed -e "s/{{VERSION}}/${VERSION}/" \
              -e "s/{{MACOS_SHA256}}/${MACOS_SHA256}/" \
              "${GITHUB_WORKSPACE}/.github/homebrew/anoa.rb.tpl" > Casks/anoa.rb

          # Linux Formula
          sed -e "s/{{VERSION}}/${VERSION}/" \
              -e "s/{{LINUX_X86_64_SHA256}}/${LINUX_X86_64_SHA256}/" \
              -e "s/{{LINUX_AARCH64_SHA256}}/${LINUX_AARCH64_SHA256}/" \
              "${GITHUB_WORKSPACE}/.github/homebrew/anoa-linux.rb.tpl" > Formula/anoa-linux.rb

          # Verify the rendered tap before pushing it: one invalid file makes
          # the whole tap un-tappable for everyone (issue #37).
          "${GITHUB_WORKSPACE}/scripts/validate_homebrew_templates.sh" .

          # Retire the old names properly rather than leaving two of everything.
          #
          # Homebrew reads these maps from a tap root and follows them on
          # upgrade, so someone who installed `anoa-browser` is carried to
          # `anoa` instead of being told the cask no longer exists. Deleting the
          # old files without the maps would strand them: `brew upgrade` reports
          # "No available formula or cask" and their install just stops getting
          # updates, silently.
          printf '{\n  "anoa-browser": "anoa"\n}\n' > cask_renames.json
          printf '{\n  "anoa-browser-linux": "anoa-linux"\n}\n' > formula_renames.json
          rm -f Casks/anoa-browser.rb Formula/anoa-browser-linux.rb

          git add -A
          if git diff --cached --quiet; then
            echo "Tap already up to date with ${TAG} — nothing to push."
            exit 0
          fi
          git commit -m "anoa v${VERSION}"
          git push
